<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spektrum — Daily German Puzzle</title>
  <style>
    :root {font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24302d;background:#f6f7f3}
    *{box-sizing:border-box}body{margin:0;padding:24px 14px}.app{max-width:780px;margin:20px auto;background:#fff;border:1px solid #dfe5dd;border-radius:22px;padding:clamp(18px,4vw,32px);box-shadow:0 10px 35px #1c362109}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:clamp(27px,5vw,36px);margin:0;letter-spacing:-1px}.eyebrow,.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:750;color:#6c7b73}.eyebrow{margin:5px 0 0}.logo{font-size:27px;background:#eff2ed;border-radius:15px;padding:11px} .intro{background:#f1f4ee;padding:18px;border-radius:14px;margin-top:22px}.intro h2{font-size:17px;margin:0 0 7px}.intro p{margin:0 0 12px;line-height:1.5;color:#516058}.hint{font-weight:700;margin-top:12px;padding-top:11px;border-top:1px solid #d7dfd4}button{font:inherit;cursor:pointer;border:1px solid #cad5c9;border-radius:10px;padding:12px;background:white;color:#26332a}button:hover:not(:disabled){background:#eef5e9}button:disabled{cursor:default;opacity:.48}.hint-btn{width:100%}.game{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:23px}.section-title{margin:0 0 12px}.bank{display:grid;gap:9px}.word{min-height:55px;font-weight:650;font-size:15px}.word.used{background:#f3f5f1;color:#8a978b}.spectrum{display:flex;flex-direction:column;gap:7px}.end{color:#62756a;font-size:12px;font-weight:750;display:flex;gap:5px;align-items:center}.slot-row{display:flex;gap:9px;align-items:stretch}.rail{width:4px;flex:none;border-radius:5px;background:#a5b6a7}.slot{min-height:55px;width:100%;text-align:left;padding:10px 12px;font-size:14px;font-weight:650;background:#fff}.slot.filled{background:#f0f4ed}.slot.correct{border-color:#c69875;background:#efd9c5;color:#664b38}.slot.correct:disabled{opacity:1}.slot .index{color:#a3aca1;font-weight:400}.slot .remove{float:right;color:#8a978b}.actions{display:flex;gap:10px;margin-top:22px}.primary{background:#285f43;border-color:#285f43;color:white;flex:1;font-weight:750}.primary:hover:not(:disabled){background:#1c4b33}.secondary{min-width:100px}#feedback{margin-top:14px;border-radius:12px;background:#eff3ec;padding:15px;line-height:1.5}#feedback[hidden],#hint[hidden]{display:none}.subtext{color:#5e7162;font-size:13px}footer{font-size:12px;color:#728075;margin-top:20px}@media(max-width:440px){.game{gap:12px}.app{padding:15px}.word,.slot{font-size:12px;padding:9px 6px}.slot{min-height:65px}.word{min-height:65px}.slot .remove{font-size:10px}.rail{width:3px}}
    .game[hidden]{display:none}

    /* Phone layout: keep the complete puzzle within the visible screen. */
    @media (max-width: 600px) and (orientation: portrait) {
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body { padding: 0; }
      .app {
        height: 100vh; height: 100dvh;
        max-width: none; margin: 0;
        padding: max(8px, env(safe-area-inset-top)) 12px max(8px, env(safe-area-inset-bottom));
        border: 0; border-radius: 0; box-shadow: none;
        display: flex; flex-direction: column; gap: 0;
        overflow: hidden;
      }
      header { flex: 0 0 auto; gap: 8px; }
      h1 { font-size: clamp(23px, 4vh, 30px); }
      .eyebrow { margin: 1px 0 0; font-size: 10px; }
      .logo { font-size: 20px; padding: 7px; border-radius: 10px; }
      .intro { flex: 0 0 auto; margin-top: 9px; padding: 10px 12px; border-radius: 11px; }
      .intro h2 { font-size: 14px; margin-bottom: 3px; }
      .intro p { font-size: 12px; line-height: 1.3; margin-bottom: 7px; }
      .hint-btn { padding: 6px 8px; font-size: 12px; }
      .hint { font-size: 12px; margin-top: 6px; padding-top: 6px; }
      .game {
        flex: 1 1 auto; min-height: 0; margin-top: 10px;
        gap: 10px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }
      .game > section { min-height: 0; display: flex; flex-direction: column; }
      .section-title { margin: 0 0 7px; font-size: 10px; }
      .bank { flex: 1 1 auto; min-height: 0; grid-template-rows: repeat(6, minmax(0, 1fr)); gap: 5px; }
      .word { height: 100%; min-height: 0; font-size: 12px; padding: 3px 5px; border-radius: 8px; }
      .game > section > .spectrum { flex: 1 1 auto; min-height: 0; }
      .spectrum { gap: 4px; }
      #slots { flex: 1 1 auto; min-height: 0; }
      .slot-row { flex: 1 1 0; min-height: 0; gap: 5px; }
      .slot { min-height: 0; height: 100%; font-size: 12px; padding: 3px 5px; border-radius: 8px; }
      .rail { width: 3px; }
      .end { font-size: 10px; line-height: 1.1; }
      .actions { flex: 0 0 auto; margin-top: 9px; gap: 8px; }
      .actions button { padding: 8px 10px; font-size: 13px; }
      .secondary { min-width: 82px; }
      #feedback { flex: 0 0 auto; margin-top: 7px; padding: 8px 10px; font-size: 12px; line-height: 1.3; }
      .subtext { font-size: 11px; }
      footer { display: none; }
    }
    /* Extra small screens: favour keeping all six words visible. */
    @media (max-width: 600px) and (orientation: portrait) and (max-height: 660px) {
      .intro { margin-top: 6px; padding: 7px 10px; }
      .intro h2 { font-size: 13px; }
      .intro p { margin-bottom: 5px; font-size: 11px; }
      .hint-btn { padding: 4px 6px; }
      .game { margin-top: 7px; }
      .section-title { margin-bottom: 4px; }
      .bank { gap: 4px; }
      .spectrum { gap: 3px; }
      .actions { margin-top: 6px; }
      .actions button { padding: 6px 8px; }
      #feedback { padding: 6px 8px; margin-top: 5px; }
    }
  </style>
</head>
<body>
<main class="app">
  <header><div><h1>Spektrum</h1><p class="eyebrow" id="puzzleDate">--/--</p></div><div class="logo" aria-hidden="true">🧠</div></header>
  <section class="intro"><h2>What's the hidden connection?</h2><p>Arrange the six German words along a mystery continuum.</p><button type="button" id="hintButton" class="hint-btn">💡 Hint</button><div id="hint" class="hint" hidden></div></section>
  <div class="game" id="game">
    <section><p class="section-title">Word bank</p><div id="bank" class="bank"></div></section>
    <section><p class="section-title">Your continuum</p><div class="spectrum"><div class="end">↑ MOST</div><div id="slots" class="spectrum"></div><div class="end">↓ LEAST</div></div></section>
  </div>
  <div id="feedback" role="status" aria-live="polite" hidden></div>
  <div class="actions"><button type="button" class="primary" id="checkButton">Check</button><button type="button" class="secondary" id="resetButton">↻ Reset</button></div>
  <footer></footer>
</main>
<script>
  // Puzzle content is loaded by date from puzzles.json.
  let words = [];
  let answerBottomToTop = [];
  let puzzleHint = '';
  let placed = []; // first word is the bottom of the continuum
  let attempts = 0;
  let solved = false;
  let currentPuzzleDate = '';
  const bank = document.getElementById('bank');
  const slots = document.getElementById('slots');
  const check = document.getElementById('checkButton');
  const feedback = document.getElementById('feedback');
  const hint = document.getElementById('hint');
  const hintButton = document.getElementById('hintButton');
  const puzzleDate = document.getElementById('puzzleDate');
  const game = document.getElementById('game');
  const resetButton = document.getElementById('resetButton');
  check.disabled = true;
  hintButton.disabled = true;
  resetButton.disabled = true;
  function render() {
    bank.replaceChildren();
    for (const word of words) {
      const btn = document.createElement('button');
      btn.type='button'; btn.className='word' + (placed.includes(word)?' used':'');
      btn.textContent=(placed.includes(word)?'✓ ':'')+word;
      btn.disabled=solved||placed.includes(word);
      btn.addEventListener('click',()=>{placed.push(word);clearFeedback();render()});
      bank.append(btn);
    }
    slots.replaceChildren();
    for (let index=words.length-1; index>=0; index--) {
      const row=document.createElement('div');row.className='slot-row';
      const rail=document.createElement('div');rail.className='rail';
      const btn=document.createElement('button');btn.type='button';
      btn.className='slot'+(placed[index]?' filled':'')+(solved?' correct':'');
      if (placed[index]) {
        const label=document.createElement('span');label.textContent=placed[index];btn.append(label);
        if(!solved){const x=document.createElement('span');x.className='remove';x.textContent='✕';btn.append(x)}
        btn.disabled=solved;
        btn.setAttribute('aria-label',solved?placed[index]:'Remove '+placed[index]);
        btn.addEventListener('click',()=>{if(!solved){placed.splice(index,1);clearFeedback();render()}});
      } else {btn.disabled=true}
      row.append(rail,btn);slots.append(row);
    }
    check.disabled=solved||placed.length!==words.length||words.length===0;
  }
  function clearFeedback(){feedback.hidden=true;feedback.textContent=''}
  function showSolvedResult() {
    solved = true;
    placed = [...answerBottomToTop];
    hint.hidden = false;
    hintButton.hidden = true;
    feedback.hidden = false;
    feedback.replaceChildren();
    const title = document.createElement('strong');
    title.textContent = '✓ You solved the mystery!';
    const detail = document.createElement('div');
    detail.className = 'subtext';
    detail.textContent = `${puzzleHint} · Solved in ${attempts} ${attempts===1?'attempt':'attempts'}.`;
    feedback.append(title, detail);
    // Completed daily puzzles stay completed; reset is unavailable after solving.
    resetButton.disabled = true;
    render();
  }
  function saveCompletion() {
    try {
      localStorage.setItem(`spektrum-completed-${currentPuzzleDate}`, JSON.stringify({ attempts }));
    } catch (error) { console.warn('Could not save puzzle completion:', error); }
  }
  function restoreCompletion() {
    try {
      const raw = localStorage.getItem(`spektrum-completed-${currentPuzzleDate}`);
      if (!raw) return false;
      const saved = JSON.parse(raw);
      attempts = Number.isInteger(saved.attempts) && saved.attempts > 0 ? saved.attempts : 1;
      showSolvedResult();
      return true;
    } catch (error) { console.warn('Could not restore puzzle completion:', error); return false; }
  }
  hintButton.addEventListener('click',()=>{hint.hidden=false;hintButton.hidden=true});
  check.addEventListener('click',()=>{
    attempts++;
    const correct=placed.length===answerBottomToTop.length && placed.every((w,i)=>w===answerBottomToTop[i]);
    feedback.hidden=false;
    if (correct) {
      saveCompletion();
      showSolvedResult();
    } else {
      feedback.textContent='Not quite! Try a different order.';
      render();
    }
  });
  resetButton.addEventListener('click',()=>{placed=[];attempts=0;solved=false;hint.hidden=true;hintButton.hidden=false;clearFeedback();render()});

  // Use the calendar date in Germany, for the same daily puzzle worldwide.
  function todayInGermany() {
    const parts = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Europe/Berlin', year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date());
    const part = type => parts.find(p => p.type === type).value;
    return `${part('year')}-${part('month')}-${part('day')}`;
  }

  function showUnavailable(message) {
    game.hidden = true;
    check.disabled = true;
    resetButton.disabled = true;
    hintButton.hidden = true;
    feedback.hidden = false;
    feedback.textContent = message;
  }

  async function loadDailyPuzzle() {
    const date = todayInGermany();
    const [year, month, day] = date.split('-');
    puzzleDate.textContent = `${day}/${month}`;
    try {
      // Disable caching so newly uploaded puzzles appear on refresh.
      const response = await fetch('puzzles.json', { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const puzzles = await response.json();
      const puzzle = puzzles[date];
      if (!puzzle) {
        showUnavailable('No puzzle available today. Check back soon!');
        return;
      }
      if (!Array.isArray(puzzle.words) || !Array.isArray(puzzle.answer) ||
          puzzle.words.length === 0 || puzzle.words.length !== puzzle.answer.length ||
          !puzzle.words.every(w => puzzle.answer.includes(w)) ||
          typeof puzzle.hint !== 'string') {
        throw new Error('Invalid puzzle data');
      }
      currentPuzzleDate = date;
      words = puzzle.words;
      answerBottomToTop = puzzle.answer;
      puzzleHint = puzzle.hint;
      hint.textContent = `💡 ${puzzleHint}`;
      placed = [];
      attempts = 0;
      solved = false;
      hint.hidden = true;
      hintButton.hidden = false;
      hintButton.disabled = false;
      resetButton.disabled = false;
      clearFeedback();
      if (!restoreCompletion()) render();
    } catch (error) {
      console.error('Could not load puzzles.json:', error);
      showUnavailable('Could not load today’s puzzle. Please refresh the page or try again later.');
    }
  }
  loadDailyPuzzle();
</script>
</body>
</html>
